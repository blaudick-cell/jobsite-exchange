# Netlify config for the JobsiteExchange marketing site.
#
# This repo is the static marketing mockup: a single index.html + styles.css,
# plus standalone privacy.html / terms.html, all served from the repo root.
# There is no build step and no Netlify Functions in this repo.
#
# (The previous config here was exported from the full "dex-platform" app and
# pointed `publish`/`command`/`functions` at /home/user/workspace/dex-platform/...,
# which does not exist in this repo and would fail the build. It also proxied
# /api/* to Netlify Functions and had a /* -> /index.html SPA fallback — neither
# applies to this static site. Restore those rules only if this repo ever becomes
# the production deploy for the full application.)

[build]
  publish = "."

# ── Clean URLs for the legal pages (serve the .html file, keep the pretty path) ──
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# ── Caching ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/legal.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
